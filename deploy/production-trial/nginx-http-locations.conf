# Included only in the existing port-80 server for 1.15.23.152.
# Load nginx-push-log.conf in http{} first. Keep the existing / return 404.
# Only the HMAC-authenticated callback is exposed over HTTP for this exhibition.
location = /api/dingdong/prototype/events {
    access_log /var/log/nginx/dingdong-push-access.log dingdong_push;
    proxy_pass http://127.0.0.1:18080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 65s;
}
