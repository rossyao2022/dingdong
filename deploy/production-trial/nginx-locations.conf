# Included only in the HTTPS server for 1.15.23.152.
# Load nginx-push-log.conf inside http{} first.
# The parent server retains its existing location / { return 404; }.
# The Django technical admin is not part of the public trial. The second
# route prevents reaching it through the /dingdong/ prefix rewrite.
location ^~ /admin/ { return 404; }
location ^~ /dingdong/admin/ { return 404; }

location ^~ /dingdong/ {
    proxy_pass http://127.0.0.1:18080/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 65s;
}

# Dedicated callback evidence, without payloads or credentials in access logs.
location = /api/dingdong/prototype/events {
    access_log /var/log/nginx/dingdong-push-access.log dingdong_push;
    proxy_pass http://127.0.0.1:18080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 65s;
}

# Django validates JWT/session access to API endpoints.
location ^~ /api/ {
    proxy_pass http://127.0.0.1:18080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 65s;
}

location ~ ^/(ops/|static/) {
    proxy_pass http://127.0.0.1:18080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 65s;
}
