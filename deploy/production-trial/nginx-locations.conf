# Included only in the HTTPS server for 1.15.23.152.
# The parent server retains its existing location / { return 404; }.
location ^~ /dingdong/ {
    auth_basic "DingDong ops trial";
    auth_basic_user_file /etc/nginx/.dingdong-prod-trial.htpasswd;
    proxy_pass http://127.0.0.1:18080/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Authorization "";
    proxy_read_timeout 65s;
}

# Fixed-code login endpoints must pass the outer access gate. These calls do
# not carry the app's Bearer token, so HTTP Basic authentication can coexist.
location ^~ /api/v1/auth/ {
    auth_basic "DingDong ops trial";
    auth_basic_user_file /etc/nginx/.dingdong-prod-trial.htpasswd;
    proxy_pass http://127.0.0.1:18080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Authorization "";
    proxy_read_timeout 65s;
}

# Other API calls may carry Authorization: Bearer. HTTP Basic would reject
# them because one request cannot carry both Authorization schemes. Django
# remains responsible for validating JWT/session access to these endpoints.
location ^~ /api/ {
    proxy_pass http://127.0.0.1:18080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 65s;
}

location ~ ^/(admin/|ops/|static/) {
    auth_basic "DingDong ops trial";
    auth_basic_user_file /etc/nginx/.dingdong-prod-trial.htpasswd;
    proxy_pass http://127.0.0.1:18080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Authorization "";
    proxy_read_timeout 65s;
}
