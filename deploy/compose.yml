name: dingdong-demo
x-app: &app
  image: dingdong-backend:${APP_VERSION:?set APP_VERSION}
  build:
    context: ..
    dockerfile: deploy/Dockerfile.backend
  restart: unless-stopped
  environment: &env
    APP_ENV: demo
    CA_DEMO_REPORTS_ENABLED: ${CA_DEMO_REPORTS_ENABLED:-true}
    # 运营后台把版本号拼在静态资源 URL 上做缓存击穿，并显示在页脚。
    # 缺少它会导致上线后浏览器继续用旧界面的静态资源。
    APP_VERSION: ${APP_VERSION:?set APP_VERSION}
    DJANGO_SETTINGS_MODULE: config.settings.deployment
    PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}
    ADDITIONAL_ORIGINS: ${ADDITIONAL_ORIGINS:-}
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set secret}
    JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?set secret}
    # fixed_code 仅供演示；aliyun_verify 使用本项目独立 RAM AccessKey 和号码认证赠送签名/模板。
    SMS_MODE: ${SMS_MODE:-fixed_code}
    ALIYUN_VERIFY_ACCESS_KEY_ID: ${ALIYUN_VERIFY_ACCESS_KEY_ID:-}
    ALIYUN_VERIFY_ACCESS_KEY_SECRET: ${ALIYUN_VERIFY_ACCESS_KEY_SECRET:-}
    ALIYUN_VERIFY_SIGN_NAME: ${ALIYUN_VERIFY_SIGN_NAME:-}
    ALIYUN_VERIFY_TEMPLATE_CODE: ${ALIYUN_VERIFY_TEMPLATE_CODE:-}
    ALIYUN_VERIFY_REGION: ${ALIYUN_VERIFY_REGION:-cn-shanghai}
    ALIYUN_VERIFY_ENDPOINT: ${ALIYUN_VERIFY_ENDPOINT:-dypnsapi.aliyuncs.com}
    DATABASE_URL: postgres://dingdong:${POSTGRES_PASSWORD:?set password}@postgres:5432/dingdong
    CELERY_BROKER_URL: redis://redis:6379/0
    OPS_LOGIN_CACHE_URL: redis://redis:6379/1
    # DingDong 联调（10.4 演示）：全部留空 = 「未接通」语义，不伪造成功。
    # ALLOW_HTTP 只为对方纯 HTTP 测试环境开豁免，默认拒绝明文。
    DINGDONG_BASE_URL: ${DINGDONG_BASE_URL:-}
    DINGDONG_API_KEY: ${DINGDONG_API_KEY:-}
    DINGDONG_ALLOW_HTTP: ${DINGDONG_ALLOW_HTTP:-false}
    DINGDONG_TIMEOUT_SECONDS: ${DINGDONG_TIMEOUT_SECONDS:-10}
    DINGDONG_PUSH_SECRET: ${DINGDONG_PUSH_SECRET:-}
    DINGDONG_PROTOTYPE_DEMO_ENABLED: ${DINGDONG_PROTOTYPE_DEMO_ENABLED:-false}
    DINGDONG_PROTOTYPE_NFC_TOKEN: ${DINGDONG_PROTOTYPE_NFC_TOKEN:-}
    DINGDONG_PROTOTYPE_WEB_URL: ${DINGDONG_PROTOTYPE_WEB_URL:-}
    CA_DISPLAY_DATA_SOURCE: ${CA_DISPLAY_DATA_SOURCE:-synthetic_fixture}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dingdong
      POSTGRES_USER: dingdong
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set password}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dingdong -d dingdong"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  init:
    <<: *app
    restart: "no"
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py seed_base && python manage.py seed_mock --dataset phase1-v1 --mode cold"]
  api:
    <<: *app
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/v1/runtime',headers={'Host':os.environ['PUBLIC_ORIGIN'].split('://')[1]}); urllib.request.urlopen(r,timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
  worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "--loglevel=WARNING", "--queues=dingdong-ca", "--concurrency=2"]
    depends_on:
      api:
        condition: service_healthy
  beat:
    <<: *app
    command: ["celery", "-A", "config", "beat", "--loglevel=WARNING", "--schedule=/tmp/celerybeat"]
    depends_on:
      api:
        condition: service_healthy
  web:
    image: dingdong-web:${APP_VERSION:?set APP_VERSION}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    environment:
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:?set PUBLIC_SCHEME}
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-18080}:8080"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
  redis_data:
