# Included only in the existing public-IP HTTP server block.
location = /dingdong { return 301 /dingdong/; }
location ^~ /dingdong/ {
    proxy_pass http://127.0.0.1:18473/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 65s;
    client_max_body_size 2m;
    access_log off;
}
# The current client and Django admin use these root paths.
# The existing public-IP site is static and has no handlers/directories here.
location ^~ /api/v1/ {
    proxy_pass http://127.0.0.1:18473;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 65s;
    client_max_body_size 2m;
    access_log off;
}
location ^~ /admin/ {
    proxy_pass http://127.0.0.1:18473;
    proxy_set_header Host $http_host;
    proxy_read_timeout 65s;
    access_log off;
}
location ^~ /static/ {
    proxy_pass http://127.0.0.1:18473;
    proxy_set_header Host $http_host;
    access_log off;
}
