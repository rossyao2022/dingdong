# Included only in the existing public-IP HTTP server block.
location = /dingdong { return 301 /dingdong/; }
location ^~ /dingdong/ {
    proxy_pass http://127.0.0.1:18473/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 65s;
    client_max_body_size 2m;
    access_log off;
}
# The current client and Django admin use these root paths.
# The existing public-IP site is static and has no handlers/directories here.
#
# /ops/ must be a ROOT path, not only /dingdong/ops/. Django generates
# root-absolute URLs (redirects, {% url %}), so a prefix-stripping proxy
# cannot host the console under a sub-path: /dingdong/ops/ works for the
# first request, but every link and redirect then jumps to /ops/.
# Verified before adding: /www/wwwroot/game has no `ops` directory and the
# existing site's index.html/assets contain no /ops references, so /ops/
# only ever returned that site's SPA fallback.
location = /ops { return 301 /ops/; }
location ^~ /ops/ {
    proxy_pass http://127.0.0.1:18473;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 65s;
    client_max_body_size 2m;
    access_log off;
}
location ^~ /api/v1/ {
    proxy_pass http://127.0.0.1:18473;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 65s;
    client_max_body_size 2m;
    access_log off;
}
location ^~ /admin/ {
    proxy_pass http://127.0.0.1:18473;
    proxy_set_header Host $http_host;
    proxy_read_timeout 65s;
    access_log off;
}
location ^~ /static/ {
    proxy_pass http://127.0.0.1:18473;
    proxy_set_header Host $http_host;
    access_log off;
}
