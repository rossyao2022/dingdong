name: dingdong-ca
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dingdong
      POSTGRES_USER: dingdong
      POSTGRES_PASSWORD: local-dingdong-only
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dingdong -d dingdong"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
